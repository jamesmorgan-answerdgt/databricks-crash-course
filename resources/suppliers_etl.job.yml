# The suppliers ETL job. Task order mirrors the medallion layers:
#   apply_ddl -> bronze -> silver -> gold -> data_quality_checks
# Paths are relative to this file.

resources:
  jobs:
    suppliers_etl:
      name: suppliers_etl
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause_status}

      # Serverless compute for every task.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      tasks:
        - task_key: apply_ddl
          environment_key: default
          spark_python_task:
            python_file: ../SQL/apply_ddl.py
            parameters:
              - --catalog=${var.catalog}
              - --schema-prefix=${var.schema_prefix}
              - --ddl-dir=${workspace.file_path}/SQL/ddl

        - task_key: bronze_ingest_suppliers
          depends_on:
            - task_key: apply_ddl
          environment_key: default
          spark_python_task:
            python_file: ../ETL/bronze/ingest_suppliers.py
            parameters:
              - --catalog=${var.catalog}
              - --schema-prefix=${var.schema_prefix}

        - task_key: silver_suppliers
          depends_on:
            - task_key: bronze_ingest_suppliers
          environment_key: default
          spark_python_task:
            python_file: ../ETL/silver/clean_suppliers.py
            parameters:
              - --catalog=${var.catalog}
              - --schema-prefix=${var.schema_prefix}

        - task_key: gold_asian_suppliers
          depends_on:
            - task_key: silver_suppliers
          environment_key: default
          spark_python_task:
            python_file: ../ETL/gold/asian_suppliers.py
            parameters:
              - --catalog=${var.catalog}
              - --schema-prefix=${var.schema_prefix}

        # Fails the run (and therefore the CI deploy) if the data looks wrong.
        - task_key: data_quality_checks
          depends_on:
            - task_key: gold_asian_suppliers
          environment_key: default
          spark_python_task:
            python_file: ../tests/integration/data_quality_checks.py
            parameters:
              - --catalog=${var.catalog}
              - --schema-prefix=${var.schema_prefix}
